# Hugo configuration file
title: nick-we.com

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Blog
      pageRef: /blog
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://github.com/nick-we"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/nick-we"
      params:
        icon: github
    - name: Theme Toggle
      weight: 6
      params:
        type: theme-toggle
        label: true # optional, default is false

enableGitInfo: true

params:
  comments:
    enable: true
    type: giscus

    giscus:
      repo: nick-we/nick-we-blog
      repoId: R_kgDOQYuoIQ
      category: Announcements
      categoryId: DIC_kwDOQYuoIc4Cx9mz

  externalLinkDecoration: true

  blog:
    list:
      displayTags: true
  toc:
    displayTags: true

  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  theme:
    # light | dark | system
    default: dark
    displayToggle: true

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false
