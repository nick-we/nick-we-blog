# Hugo configuration file
baseURL: "https://nick-we.com/"
title: Nick Westendorf - Blog
description: Hi I'm Nick Westendorf, and this is where I share my thoughts on software engineering and technology.

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: GitHub
      weight: 1
      url: "https://github.com/nick-we"
    - name: Contact ↗
      weight: 2
      url: "mailto:mail@nick-we.com"
      params:
        type: mail
    - name: Search
      weight: 3
      params:
        type: search
    - name: Theme Toggle
      weight: 4
      params:
        type: theme-toggle

  sidebar:
    - name: GitHub
      weight: 1
      url: "https://github.com/nick-we"
    - name: Contact ↗
      weight: 2
      url: "mailto:mail@nick-we.com"
      params:
        type: mail

enableRobotsTXT: true
enableGitInfo: true
enableInlineShortcodes: true

params:
  description: Hi I'm Nick Westendorf, and this is where I share my thoughts on software engineering and technology.

  comments:
    enable: true
    type: giscus

    giscus:
      repo: nick-we/nick-we-blog
      repoId: R_kgDOQYuoIQ
      category: Announcements
      categoryId: DIC_kwDOQYuoIc4Cx9mz

  externalLinkDecoration: true

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
      # Pagination
      pagerSize: 20

    article:
      displayPagination: true
  
  toc:
    displayTags: true

  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  theme:
    # light | dark | system
    default: light
    displayToggle: true

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      link: /
      width: 40
      height: 40

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  search:
    enable: true
    type: flexsearch

  flexsearch:
    # index page by: content | summary | heading | title
    index: content
    # full | forward | reverse | strict
    # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
    tokenize: forward

  page:
    # full (100%), wide (90rem), normal (80rem)
    width: normal
